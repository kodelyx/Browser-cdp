<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>browser-Cdp</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3" />
        <path d="M16 3h3a2 2 0 0 1 2 2v3" />
        <path d="M8 21H5a2 2 0 0 1-2-2v-3" />
        <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
        <path d="M12 8v8" />
        <path d="M8 12h8" />
      </svg>
    </span>
    <span class="name">browser-Cdp</span>
    <span id="version" class="version"></span>
  </header>

  <div id="card" class="card">
    <span id="dot" class="dot"></span>
    <span class="card-text">
      <span id="title" class="card-title">Waiting for backend</span>
      <span id="detail" class="card-detail"></span>
    </span>
  </div>

  <button id="reconnect" class="secondary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-2.64-6.36" />
      <path d="M21 3v6h-6" />
    </svg>
    Reconnect
  </button>

  <button id="copyPrompt">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="9" width="12" height="12" rx="2" />
      <path d="M5 15V5a2 2 0 0 1 2-2h10" />
    </svg>
    Copy AI prompt
  </button>

  <p class="hint">Paste it into any AI to let it drive this browser.</p>
  <p id="note" class="note"></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
